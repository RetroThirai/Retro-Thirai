<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Retro Thirai - Professional poster design showcase featuring 30+ vintage-inspired movie and event posters with retro aesthetics." />
    <meta name="keywords" content="retro posters, vintage design, movie posters, poster gallery, graphic design" />
    <meta name="author" content="Retro Thirai" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Retro Thirai - Poster Design Showcase" />
    <meta property="og:description" content="Professional poster design showcase featuring vintage-inspired designs" />
    <meta property="og:type" content="website" />

    <title>Retro Thirai - Poster Design Showcase</title>
  </head>
  <body>
    <div id="app">
      <!-- Header Section -->
      <header class="header">
        <h1 class="site-title">Retro Thirai</h1>
        <p class="site-subtitle">Your wall deserves our posters</p>
      </header>

      <!-- Main Gallery Section -->
      <main class="main-content">
        <div class="gallery-container">
          <div id="gallery" class="gallery" role="region" aria-label="Poster gallery">
            <!-- Gallery items will be generated by JavaScript -->
          </div>
        </div>
      </main>

      <!-- Footer Section -->
      <footer class="footer">
        <p class="footer-text">Posters of Retro Thirai</p>
        <p class="footer-year">&copy; 2025</p>
      </footer>

      <!-- Lightbox Modal -->
      <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
        <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
        <div class="lightbox-content">
          <img src="" alt="" class="lightbox-image" id="lightbox-image" />
          <div class="lightbox-info">
            <h2 class="lightbox-title" id="lightbox-title"></h2>
            <p class="lightbox-category" id="lightbox-category"></p>
          </div>
        </div>
        <button class="lightbox-nav lightbox-prev" aria-label="Previous poster">&#8249;</button>
        <button class="lightbox-nav lightbox-next" aria-label="Next poster">&#8250;</button>
      </div>

      <!-- Loading Overlay -->
      <div id="loading" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading Gallery...</p>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
